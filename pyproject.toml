[project]
name = "tcp-connection-state-parser"
version = "0.1.0"
description = "Parse /proc/net/tcp and /proc/net/tcp6 into structured records with decoded state names and timers."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
